name: Publikuj instrukcje dla tabletów

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publikuj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zbuduj spis instrukcji (manifest.json)
        run: |
          mkdir -p _site
          python narzedzia/zbuduj_manifest.py _site/manifest.json
          cp -r instrukcje _site/ 2>/dev/null || mkdir -p _site/instrukcje
          cp -r aplikacja _site/ 2>/dev/null || true
          cp narzedzia/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
